<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --black:#0a0a0a;
  --white:#f5f4f0;
  --gold:#c8871a;
  --gold2:#e09c2a;
  --fire:#e84c0a;
  --grey:#1a1a1a;
  --grey2:#2a2a2a;
  --muted:#888;
}
body{font-family:"Barlow",sans-serif;background:var(--black);color:var(--white);line-height:1.6;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem 1.25rem;background-image:radial-gradient(ellipse at 50% 100%,rgba(200,135,26,0.18) 0%,transparent 60%);}
.logo{font-family:"Bebas Neue",sans-serif;font-size:1.6rem;letter-spacing:4px;color:var(--white);text-decoration:none;margin-bottom:2rem;}
.logo span{color:var(--gold);}
.code{font-family:"Bebas Neue",sans-serif;font-size:clamp(7rem,32vw,13rem);line-height:1;letter-spacing:6px;color:var(--gold);}
.msg{font-size:1.15rem;color:#ccc;max-width:420px;margin:0.5rem 0 2rem;}
.btn{display:inline-block;padding:0.9rem 2rem;font-family:"Barlow Condensed",sans-serif;font-size:0.82rem;font-weight:800;letter-spacing:3px;text-transform:uppercase;cursor:pointer;transition:all 0.2s;text-decoration:none;}
.btn-fire{background:var(--gold);color:var(--black);border:2px solid var(--gold);}
.btn-fire:hover{background:var(--gold2);border-color:var(--gold2);}
.alt{margin-top:1.5rem;font-family:"Barlow Condensed",sans-serif;font-size:0.85rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-decoration:underline;text-underline-offset:4px;}
.alt:hover{color:var(--gold);}
</style>
</head>
